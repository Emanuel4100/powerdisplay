[package]
name = "powerdisplay-core"
description = "Shared configuration, display backends and power handling for powerdisplay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json = "1"
toml.workspace = true
tracing.workspace = true

# Display backends
zbus = "5.19"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
x11rb = { version = "0.14", features = ["randr"] }

# Power source detection and config watching
udev = { version = "0.9", features = ["send"] }
rustix = { version = "1", features = ["event", "fs"] }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
