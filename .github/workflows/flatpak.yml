name: Flatpak

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  x86_64:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust SDK extension
        run: |
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y flathub org.freedesktop.Sdk.Extension.rust-stable//25.08

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: powerdisplay-x86_64.flatpak
          manifest-path: build-aux/io.github.Emanuel4100.PowerDisplay.yml
          branch: master
          cache-key: flatpak-${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: powerdisplay-x86_64
          path: powerdisplay-x86_64.flatpak

      - name: Attach bundle to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: powerdisplay-x86_64.flatpak
