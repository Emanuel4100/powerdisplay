<?xml version="1.0" encoding="UTF-8"?>
<!-- GNOME-style app icon: 128px canvas, 2px grid, top + darker front. Adwaita colors. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Stand, back to front -->
  <rect x="56" y="92" width="16" height="16" rx="2" fill="#241f31"/>
  <rect x="56" y="88" width="16" height="12" rx="2" fill="#5e5c64"/>
  <rect x="36" y="108" width="56" height="10" rx="5" fill="#241f31"/>
  <rect x="36" y="102" width="56" height="10" rx="5" fill="#5e5c64"/>

  <!-- Display: darker front, then the top face -->
  <rect x="16" y="24" width="96" height="68" rx="14" fill="#1a5fb4"/>
  <rect x="16" y="24" width="96" height="60" rx="14" fill="#3584e4"/>

  <!-- Screen -->
  <rect x="26" y="34" width="76" height="40" rx="8" fill="#99c1f1"/>

  <!-- Charge mark -->
  <path fill="#f6d32d" d="M70 38 L52 58 H62 L56 70 L76 48 H64 Z"/>
</svg>
